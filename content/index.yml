title: "Furry Geography Network"
description: "Connecting furry geographers and researchers through academic exchange and collaborative geographical research."

hero:
  eyebrow:
    en: "An Independent Academic Network"
    zh: "独立学术交流网络"
  title:
    en: "Furry Geography Network"
    zh: "Furry 地理学研究网络"
  description:
    en: "Connecting furry geographers and researchers through academic exchange and collaborative geographical research."
    zh: "连接从事地理学及相关研究的 Furry，促进学术交流，并推动 Furry 主题的地理学合作研究。"
  explore:
    en: "Explore the Network"
    zh: "关于我们"

research:
  title:
    en: "Research Interests"
    zh: "研究兴趣"
  areas:
    - id: digital-geographies
      title:
        en: "Digital Geographies"
        zh: "数字地理学"
      description:
        en: "Exploring online communities, virtual spaces, and digital interactions."
        zh: "探索线上社群、虚拟空间及数字交互的地理学特征。"

    - id: spatial-social-networks
      title:
        en: "Spatial Social Networks"
        zh: "空间社会网络"
      description:
        en: "Understanding geographical relationships within social networks."
        zh: "研究社会网络中的地理联系及其空间结构。"

    - id: furry-communities
      title:
        en: "Furry Communities & Places"
        zh: "Furry 社群与地方"
      description:
        en: "Studying conventions, mobility, and the spatial organization of furry communities."
        zh: "研究 Furry 展会、社群流动及其空间组织。"

collaborations:
  title:
    en: "Open Collaborations"
    zh: "开放合作项目"
  description:
    en: "We welcome collaboration across geography, GIScience, social sciences, and computational research related to furry communities."
    zh: "我们欢迎来自地理学、地理信息科学、社会科学及计算研究等领域的研究者，共同开展与 Furry 社群相关的跨学科合作研究。"
